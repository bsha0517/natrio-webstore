<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Natrio Organics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/favicon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="page-header"><h1>Checkout</h1></div>

  <div class="cart-layout">
    <div>
      <form id="checkoutForm">
        <h3>Contact & Delivery</h3>
        <div class="form-grid">
          <div><label>Full Name *</label><input name="name" id="checkoutName" required></div>
          <div>
            <label>Phone *</label>
            <input name="phone" type="tel" required placeholder="03xx-xxxxxxx" pattern="^(03\d{9}|\+923\d{9})$" title="Enter a valid Pakistani mobile number, e.g. 03001234567">
          </div>
          <div class="full"><label>Email *</label><input name="email" id="checkoutEmail" type="email" required></div>
          <div class="full"><label>Address *</label><input name="address" required></div>
          <div>
            <label>City *</label>
            <select name="city" id="citySelect" required>
              <option value="" disabled selected>Select your city</option>
              <option>Lahore</option>
              <option>Karachi</option>
              <option>Islamabad</option>
              <option>Rawalpindi</option>
              <option>Faisalabad</option>
              <option>Multan</option>
              <option>Peshawar</option>
              <option>Quetta</option>
              <option>Sialkot</option>
              <option>Gujranwala</option>
              <option>Hyderabad</option>
              <option>Bahawalpur</option>
              <option>Sargodha</option>
              <option>Sukkur</option>
              <option>Abbottabad</option>
              <option>Rahim Yar Khan</option>
              <option>Sahiwal</option>
              <option>Mardan</option>
              <option>Gujrat</option>
              <option>Kasur</option>
              <option value="__other__">Other</option>
            </select>
            <input name="cityOther" id="cityOtherInput" placeholder="Enter your city" style="margin-top:8px;display:none;">
          </div>
          <div><label>Postal Code</label><input name="zip"></div>
          <div class="full"><label>Order Notes (optional)</label><textarea name="notes"></textarea></div>
        </div>

        <h3 style="margin-top:26px;">Discount Code (optional)</h3>
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <input id="discountInput" placeholder="Enter discount code" style="flex:1;">
          <button type="button" class="btn btn-outline" style="color:var(--olive-dark);border-color:var(--line);flex-shrink:0;" onclick="applyDiscount()">Apply</button>
        </div>
        <p id="discountMsg" style="font-size:13px;margin-top:8px;"></p>

        <h3 style="margin-top:26px;">Shipping Method</h3>
        <div class="pay-options" id="shippingOptions"><p style="color:var(--muted);font-size:13px;">Loading shipping options…</p></div>

        <h3 style="margin-top:26px;">Payment Method</h3>
        <div class="pay-options" id="payOptions">
          <label class="pay-option selected"><input type="radio" name="paymentMethod" value="cod" checked> <span class="opt-label">Cash on Delivery</span></label>
          <label class="pay-option"><input type="radio" name="paymentMethod" value="jazzcash"> <span class="opt-label">JazzCash</span></label>
          <label class="pay-option"><input type="radio" name="paymentMethod" value="easypaisa"> <span class="opt-label">Easypaisa</span></label>
        </div>

        <div id="walletPaymentBox" class="hidden" style="background:var(--cream-deep);border:1px solid var(--line);padding:18px;margin-top:14px;">
          <p id="walletInstructions" style="font-size:13.5px;color:var(--ink);margin:0 0 14px;line-height:1.7;"></p>
          <label>Upload payment screenshot *</label>
          <input type="file" id="paymentProofInput" accept="image/*">
          <p id="paymentProofStatus" style="font-size:12px;margin-top:8px;"></p>
        </div>

        <label style="display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer;" id="createAccountRow">
          <input type="checkbox" id="createAccountCheckbox" style="width:auto;margin-top:2px;">
          <span>Create an account with this order for faster checkout next time.</span>
        </label>
        <div id="createAccountPasswordRow" class="hidden" style="margin-top:10px;">
          <label>Choose a password</label>
          <input type="password" id="createAccountPassword" placeholder="At least 6 characters" minlength="6">
        </div>

        <label style="display:flex;align-items:flex-start;gap:8px;margin-top:18px;font-size:13px;color:var(--muted);cursor:pointer;">
          <input type="checkbox" name="subscribeNewsletter" style="width:auto;margin-top:2px;">
          <span>Email me about offers, new arrivals, and updates from Natrio Organics.</span>
        </label>

        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;">
          <span style="display:inline-flex;align-items:center;gap:5px;background:var(--cream-deep);border:1px solid var(--line);font-size:12px;color:var(--ink);padding:6px 11px;border-radius:20px;">🔒 Secure Checkout</span>
          <span style="display:inline-flex;align-items:center;gap:5px;background:var(--cream-deep);border:1px solid var(--line);font-size:12px;color:var(--ink);padding:6px 11px;border-radius:20px;">↩️ 7-Day Returns</span>
          <span style="display:inline-flex;align-items:center;gap:5px;background:var(--cream-deep);border:1px solid var(--line);font-size:12px;color:var(--ink);padding:6px 11px;border-radius:20px;">🌿 100% Natural</span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:14px;">Place Order</button>
      </form>
    </div>

    <div class="summary-box" id="summaryCol"></div>
  </div>

  <script src="/script.js"></script>
  <script>
    let cartSubtotal = 0;
    let shippingMethods = [];
    let selectedShippingId = null;
    let appliedDiscount = null; // { code, amountOff }

    async function loadSummary() {
      const res = await fetch('/api/cart');
      const data = await res.json();
      if (!data.items.length) {
        location.href = '/cart.html';
        return;
      }
      cartSubtotal = data.subtotal;
      renderSummary();
    }

    function shippingCostFor(method) {
      if (!method) return 0;
      return (method.freeThreshold && cartSubtotal >= method.freeThreshold) ? 0 : method.cost;
    }

    function renderSummary() {
      const method = shippingMethods.find(m => m.id === selectedShippingId) || shippingMethods[0];
      const shipping = shippingCostFor(method);
      const discountOff = appliedDiscount ? appliedDiscount.amountOff : 0;
      fetch('/api/cart').then(r => r.json()).then(data => {
        document.getElementById('summaryCol').innerHTML = `
          <h3>Order Summary</h3>
          ${data.items.map(i => `
            <div class="summary-row"><span>${i.product.title} (${i.variant}) × ${i.qty}</span><span>${money(i.unitPrice * i.qty)}</span></div>
          `).join('')}
          ${appliedDiscount ? `<div class="summary-row" style="color:var(--olive);"><span>Discount (${appliedDiscount.code})</span><span>−${money(discountOff)}</span></div>` : ''}
          <div class="summary-row"><span>Shipping${method ? ` (${method.name})` : ''}</span><span>${shipping === 0 ? 'Free' : money(shipping)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${money(Math.max(0, cartSubtotal - discountOff + shipping))}</span></div>
        `;
      });
    }

    async function applyDiscount() {
      const code = document.getElementById('discountInput').value.trim();
      const msg = document.getElementById('discountMsg');
      if (!code) { msg.style.color = '#a33'; msg.textContent = 'Enter a code first.'; return; }

      const res = await fetch('/api/discounts/validate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, subtotal: cartSubtotal })
      });
      const data = await res.json();
      if (data.error) {
        appliedDiscount = null;
        msg.style.color = '#a33';
        msg.textContent = data.error;
      } else {
        appliedDiscount = { code: data.code, amountOff: data.amountOff };
        msg.style.color = 'var(--olive)';
        msg.textContent = `"${data.code}" applied — you saved ${money(data.amountOff)}.`;
      }
      renderSummary();
    }

    async function loadShippingMethods() {
      const res = await fetch('/api/shipping');
      shippingMethods = await res.json();
      if (!shippingMethods.length) {
        document.getElementById('shippingOptions').innerHTML = `<p style="color:var(--muted);font-size:13px;">No shipping methods are configured yet. Please contact the store.</p>`;
        renderSummary();
        return;
      }
      selectedShippingId = shippingMethods[0].id;
      document.getElementById('shippingOptions').innerHTML = shippingMethods.map((m, i) => `
        <label class="pay-option ${i === 0 ? 'selected' : ''}" data-shipping-id="${m.id}">
          <input type="radio" name="shippingMethodId" value="${m.id}" ${i === 0 ? 'checked' : ''}>
          <span class="opt-label">${m.name}${m.description ? ` <span style="color:var(--muted);font-size:12px;">(${m.description})</span>` : ''}</span>
          <span class="opt-price">${shippingCostFor(m) === 0 ? 'Free' : money(m.cost)}</span>
        </label>
      `).join('');

      document.querySelectorAll('#shippingOptions .pay-option').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('#shippingOptions .pay-option').forEach(o => o.classList.remove('selected'));
          el.classList.add('selected');
          selectedShippingId = el.dataset.shippingId;
          renderSummary();
        });
      });

      renderSummary();
    }

    loadSummary().then(loadShippingMethods);

    // Capture the shopper's email as soon as they've entered it — even if
    // they never finish checkout, this lets us send a reminder about the
    // items still sitting in their cart.
    document.getElementById('checkoutEmail').addEventListener('blur', function() {
      const email = this.value.trim();
      if (!email || !/^\S+@\S+\.\S+$/.test(email)) return;
      const name = document.getElementById('checkoutName').value.trim();
      fetch('/api/cart/set-email', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name })
      }).catch(() => {});
    });

    // Pre-fill contact details if the shopper is logged in
    fetch('/api/auth/me').then(r => r.json()).then(data => {
      if (data.user) {
        const form = document.getElementById('checkoutForm');
        form.name.value = data.user.name;
        form.email.value = data.user.email;
      }
    });

    document.querySelectorAll('#payOptions .pay-option').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('#payOptions .pay-option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        updateWalletPaymentBox();
      });
    });

    // Wallet payment (JazzCash / Easypaisa): show the store's wallet number
    // and require a payment screenshot before the order can be placed.
    let siteSettings = {};
    let paymentProofUrl = '';

    fetch('/api/settings').then(r => r.json()).then(s => { siteSettings = s; updateWalletPaymentBox(); }).catch(() => {});

    function updateWalletPaymentBox() {
      const selected = document.querySelector('#payOptions input[name="paymentMethod"]:checked');
      const method = selected ? selected.value : 'cod';
      const box = document.getElementById('walletPaymentBox');

      if (method !== 'jazzcash' && method !== 'easypaisa') {
        box.classList.add('hidden');
        return;
      }

      const number = method === 'jazzcash' ? siteSettings.jazzCashNumber : siteSettings.easypaisaNumber;
      const label = method === 'jazzcash' ? 'JazzCash' : 'Easypaisa';

      if (!number) {
        document.getElementById('walletInstructions').innerHTML = `${label} isn't set up for online transfer yet — please choose Cash on Delivery instead, or contact us on WhatsApp to arrange payment.`;
        document.getElementById('paymentProofInput').style.display = 'none';
      } else {
        document.getElementById('walletInstructions').innerHTML = `Send the order total via <strong>${label}</strong> to <strong>${number}</strong>${siteSettings.walletAccountTitle ? ` (${siteSettings.walletAccountTitle})` : ''}, then upload a screenshot of the payment confirmation below. Your order will be processed once we've verified the payment.`;
        document.getElementById('paymentProofInput').style.display = 'block';
      }
      box.classList.remove('hidden');
    }

    document.getElementById('paymentProofInput').addEventListener('change', async function() {
      const file = this.files[0];
      if (!file) return;
      const status = document.getElementById('paymentProofStatus');
      status.style.color = 'var(--muted)';
      status.textContent = 'Uploading…';

      const formData = new FormData();
      formData.append('proof', file);
      try {
        const res = await fetch('/api/checkout/upload-payment-proof', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.error) {
          status.style.color = '#a33';
          status.textContent = data.error;
          paymentProofUrl = '';
          return;
        }
        paymentProofUrl = data.url;
        status.style.color = 'var(--olive)';
        status.textContent = 'Uploaded ✓';
      } catch (err) {
        status.style.color = '#a33';
        status.textContent = 'Upload failed — please try again.';
        paymentProofUrl = '';
      }
    });

    // City "Other" toggle
    const citySelect = document.getElementById('citySelect');
    const cityOtherInput = document.getElementById('cityOtherInput');
    citySelect.addEventListener('change', () => {
      const isOther = citySelect.value === '__other__';
      cityOtherInput.style.display = isOther ? 'block' : 'none';
      cityOtherInput.required = isOther;
    });

    // Show/hide the account creation password field
    let isLoggedIn = false;
    fetch('/api/auth/me').then(r => r.json()).then(data => {
      isLoggedIn = !!data.user;
      if (isLoggedIn) document.getElementById('createAccountRow').style.display = 'none';
    });

    document.getElementById('createAccountCheckbox').addEventListener('change', function() {
      document.getElementById('createAccountPasswordRow').classList.toggle('hidden', !this.checked);
      document.getElementById('createAccountPassword').required = this.checked;
    });

    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = Object.fromEntries(fd.entries());

      if (body.city === '__other__') {
        body.city = (body.cityOther || '').trim();
        if (!body.city) {
          alert('Please enter your city.');
          return;
        }
      }
      delete body.cityOther;

      if ((body.paymentMethod === 'jazzcash' || body.paymentMethod === 'easypaisa') && !paymentProofUrl) {
        alert('Please upload a screenshot of your payment before placing the order.');
        return;
      }
      if (paymentProofUrl) body.paymentProofUrl = paymentProofUrl;

      if (appliedDiscount) body.discountCode = appliedDiscount.code;
      body.shippingMethodId = selectedShippingId;
      body.subscribeNewsletter = !!body.subscribeNewsletter;

      const wantsAccount = !isLoggedIn && document.getElementById('createAccountCheckbox').checked;
      const password = document.getElementById('createAccountPassword').value;

      const btn = e.target.querySelector('button[type=submit]');

      // create the account first, if requested, so the order gets linked to it
      if (wantsAccount) {
        if (!password || password.length < 6) {
          alert('Please choose a password of at least 6 characters, or uncheck "Create an account".');
          return;
        }
        btn.textContent = 'Creating your account…';
        btn.disabled = true;
        const signupRes = await fetch('/api/auth/signup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: body.name, email: body.email, password })
        });
        const signupData = await signupRes.json();
        if (signupData.error) {
          alert(signupData.error);
          btn.textContent = 'Place Order';
          btn.disabled = false;
          return;
        }
      }

      btn.textContent = 'Placing order…';
      btn.disabled = true;

      const res = await fetch('/api/checkout', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        btn.textContent = 'Place Order';
        btn.disabled = false;
        return;
      }
      location.href = `/order-confirmation.html?id=${data.orderId}`;
    });
  </script>
</body>
</html>
