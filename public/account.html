<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account — Natrio Organics</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/favicon-180.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .account-wrap { max-width: 780px; margin: 0 auto; padding: 40px 24px 90px; }
    .account-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 14px; }
    .account-head h1 { font-size: 26px; margin-bottom: 4px; }
    .account-head p { color: var(--muted); font-size: 14px; margin: 0; }
    .logout-btn { background: none; border: 1px solid var(--line); padding: 9px 18px; cursor: pointer; font-family: 'Jost'; font-size: 13px; }
    .logout-btn:hover { background: var(--cream-deep); }

    .order-card { background: var(--white); border: 1px solid var(--line); margin-bottom: 20px; }
    .order-card-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 8px; }
    .order-card-head .oid { font-weight: 600; }
    .order-card-head .odate { font-size: 12px; color: var(--muted); }
    .order-card-body { padding: 18px 20px; }
    .order-items { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .order-items div { margin-bottom: 4px; }

    .tracker { display: flex; align-items: center; margin: 18px 0 6px; }
    .tracker-step { flex: 1; text-align: center; position: relative; }
    .tracker-step .dot {
      width: 22px; height: 22px; border-radius: 50%; background: var(--line);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 6px;
      font-size: 11px; color: white; position: relative; z-index: 2;
    }
    .tracker-step.done .dot { background: var(--olive); }
    .tracker-step.current .dot { background: var(--gold); }
    .tracker-step .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .tracker-step.done .label, .tracker-step.current .label { color: var(--ink); font-weight: 500; }
    .tracker-line {
      position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 1;
    }
    .tracker-step:first-child .tracker-line { display: none; }
    .tracker-step.done .tracker-line, .tracker-step.current .tracker-line { background: var(--olive); }

    .order-total-row { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 6px; font-weight: 600; }
    .status-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; text-transform: capitalize; }
    .status-pending { background: #F5E6C4; color: #8A6A16; }
    .status-processing { background: #EDE7DC; color: var(--muted); }
    .status-shipped { background: #DCE8DC; color: var(--olive); }
    .status-delivered { background: var(--cream-deep); color: var(--olive-dark); }
    .status-cancelled { background: #F5D9D9; color: #A33; }
  </style>
</head>
<body>

  <div class="account-wrap">
    <div class="account-head">
      <div>
        <h1 id="greeting">My Account</h1>
        <p id="emailLine"></p>
      </div>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>

    <h3 style="margin-bottom:16px;">Order History</h3>
    <div id="ordersList"><p style="color:var(--muted);">Loading your orders…</p></div>
  </div>

  <script src="/script.js"></script>
  <script>
    const STEPS = ['pending', 'processing', 'shipped', 'delivered'];

    function trackerHTML(status) {
      if (status === 'cancelled') {
        return `<p style="color:#a33;font-size:13px;margin-top:14px;">This order was cancelled.</p>`;
      }
      const currentIdx = STEPS.indexOf(status);
      return `
        <div class="tracker">
          ${STEPS.map((step, i) => {
            let cls = '';
            if (i < currentIdx) cls = 'done';
            else if (i === currentIdx) cls = 'current';
            return `
              <div class="tracker-step ${cls}">
                <div class="tracker-line"></div>
                <div class="dot">${i < currentIdx ? '✓' : ''}</div>
                <div class="label">${step}</div>
              </div>`;
          }).join('')}
        </div>`;
    }

    async function init() {
      const meRes = await fetch('/api/auth/me');
      const me = await meRes.json();
      if (!me.user) {
        location.href = '/login.html';
        return;
      }
      document.getElementById('greeting').textContent = `Hi, ${me.user.name.split(' ')[0]}`;
      document.getElementById('emailLine').textContent = me.user.email;

      const res = await fetch('/api/my-orders');
      const orders = await res.json();
      const list = document.getElementById('ordersList');

      if (!orders.length) {
        list.innerHTML = `<div class="empty-state">No orders yet.<br><br><a href="/products.html" class="btn btn-dark">Start Shopping</a></div>`;
        return;
      }

      list.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-card-head">
            <div>
              <div class="oid">Order #${o.id}</div>
              <div class="odate">${new Date(o.date).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' })}</div>
            </div>
            <span class="status-badge status-${o.status}">${o.status}</span>
          </div>
          <div class="order-card-body">
            <div class="order-items">
              ${o.items.map(i => `<div>${i.title} (${i.variant}) × ${i.qty} — ${money(i.price * i.qty)}</div>`).join('')}
            </div>
            ${trackerHTML(o.status)}
            <div class="order-total-row"><span>Total</span><span>${money(o.total)}</span></div>
          </div>
        </div>
      `).join('');
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/';
    }

    init();
  </script>
</body>
</html>
