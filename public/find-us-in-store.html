<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Us In Store — Natrio Organics</title>
  <meta name="description" content="Natrio Organics is also available in-store across Lahore. Find us at these retail partners.">
  <link rel="canonical" href="https://natrio.pk/find-us-in-store.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Find Us In Store — Natrio Organics">
  <meta property="og:description" content="Natrio Organics is also available in-store across Lahore.">
  <meta property="og:url" content="https://natrio.pk/find-us-in-store.html">
  <meta property="og:image" content="https://natrio.pk/images/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/favicon-180.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .stores-wrap { max-width: 760px; margin: 0 auto; padding: 46px 24px 90px; text-align: center; }
    .stores-wrap h1 { font-size: 30px; margin-bottom: 10px; }
    .stores-wrap > p { color: var(--muted); font-size: 15px; max-width: 520px; margin: 0 auto 40px; line-height: 1.7; }
    .store-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; text-align: left; }
    .store-card { background: var(--white); border: 1px solid var(--line); padding: 24px; }
    .store-card .dot {
      width: 44px; height: 44px; border-radius: 50%; background: var(--cream-deep);
      color: var(--olive); display: flex; align-items: center; justify-content: center;
      font-size: 18px; margin-bottom: 14px;
    }
    .store-card h3 { font-size: 18px; margin-bottom: 6px; }
    .store-card .city { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; display: block; }
    .store-card p { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin: 0; }
  </style>
</head>
<body>

  <div class="stores-wrap">
    <h1>Find Us In Store</h1>
    <p>Prefer to shop in person? Natrio Organics is also available at these retail partners across Lahore.</p>
    <div class="store-grid" id="storeGrid"><p style="color:var(--muted);">Loading store locations…</p></div>
  </div>

  <script src="/script.js"></script>
  <script>
    fetch('/api/stores').then(r => r.json()).then(stores => {
      const grid = document.getElementById('storeGrid');
      if (!stores.length) {
        grid.innerHTML = `<p style="color:var(--muted);grid-column:1/-1;">We're not in any physical stores just yet — shop online any time!</p>`;
        return;
      }
      grid.innerHTML = stores.map(s => `
        <div class="store-card">
          <div class="dot">🏬</div>
          <span class="city">${s.city || 'Lahore'}</span>
          <h3>${s.name}</h3>
          ${s.address ? `<p>${s.address}</p>` : ''}
        </div>
      `).join('');
    });
  </script>
</body>
</html>
