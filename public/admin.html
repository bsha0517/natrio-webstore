<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Natrio Organics</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: var(--cream); }
    .admin-wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
    .login-box { max-width: 340px; margin: 100px auto; background:white; padding:30px; border:1px solid var(--line); }
    table { width:100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align:left; padding: 10px 12px; border-bottom:1px solid var(--line); font-size:14px; }
    th { font-family:'Jost'; color:#666; font-weight:500; }
    .tabs { display:flex; gap:20px; margin-bottom: 20px; border-bottom:1px solid var(--line); }
    .tab { padding:10px 4px; cursor:pointer; color:#888; }
    .tab.active { color:var(--olive-dark); border-bottom:2px solid var(--olive); font-weight:600; }
    .hidden { display:none; }
    .status-pending { color: #b78940; }
    .status-shipped { color: var(--olive); }
  </style>
</head>
<body>

  <div class="login-box" id="loginBox">
    <h2>Admin Login</h2>
    <label>Password</label>
    <input type="password" id="pw" style="margin-bottom:14px;">
    <button class="btn btn-primary btn-full" onclick="login()">Log In</button>
    <p id="loginErr" style="color:#a33;font-size:13px;"></p>
  </div>

  <div class="admin-wrap hidden" id="adminWrap">
    <h1>Natrio Organics — Admin</h1>
    <div class="tabs">
      <div class="tab active" data-tab="orders">Orders</div>
      <div class="tab" data-tab="products">Products</div>
    </div>

    <div id="ordersTab">
      <table>
        <thead><tr><th>ID</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th></tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>

    <div id="productsTab" class="hidden">
      <table>
        <thead><tr><th>Title</th><th>Category</th><th>Price</th><th>Stock</th></tr></thead>
        <tbody id="productsBody"></tbody>
      </table>
      <p style="font-size:13px;color:#888;margin-top:16px;">To add or edit products in bulk, edit <code>data/products.json</code> directly on your server, or extend this panel with a form (see README for the API routes: POST/PUT/DELETE <code>/api/admin/products</code>).</p>
    </div>
  </div>

  <script>
    function money(n) { return 'Rs. ' + Number(n).toLocaleString(); }

    async function login() {
      const password = document.getElementById('pw').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ password })
      });
      if (res.ok) {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('adminWrap').classList.remove('hidden');
        loadOrders();
        loadProducts();
      } else {
        document.getElementById('loginErr').textContent = 'Incorrect password.';
      }
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('ordersTab').classList.toggle('hidden', tab.dataset.tab !== 'orders');
        document.getElementById('productsTab').classList.toggle('hidden', tab.dataset.tab !== 'products');
      });
    });

    async function loadOrders() {
      const res = await fetch('/api/admin/orders');
      const orders = await res.json();
      document.getElementById('ordersBody').innerHTML = orders.slice().reverse().map(o => `
        <tr>
          <td>#${o.id}</td>
          <td>${new Date(o.date).toLocaleDateString()}</td>
          <td>${o.customer.name}<br><span style="color:#888;">${o.customer.phone}</span></td>
          <td>${o.items.map(i => `${i.title} ×${i.qty}`).join('<br>')}</td>
          <td>${money(o.total)}</td>
          <td>${o.paymentMethod.toUpperCase()}</td>
        </tr>
      `).join('') || '<tr><td colspan="6">No orders yet.</td></tr>';
    }

    async function loadProducts() {
      const res = await fetch('/api/products');
      const products = await res.json();
      document.getElementById('productsBody').innerHTML = products.map(p => `
        <tr><td>${p.title}</td><td>${p.category}</td><td>${money(p.price)}</td><td>${p.stock}</td></tr>
      `).join('');
    }
  </script>
</body>
</html>
