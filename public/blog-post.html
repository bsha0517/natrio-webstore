<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Server-rendered by worker/src/index.js (route /blog/:slug). The
       {{…}} placeholders are filled in for each article. -->
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Natrio Organics">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="article:published_time" content="{{PUBLISHED}}">
  <meta property="article:modified_time" content="{{MODIFIED}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/favicon-180.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .post-wrap { max-width: 740px; margin: 0 auto; padding: 40px 24px 80px; }
    .post-wrap .back-link { font-size: 13px; color: var(--muted); display: inline-block; margin-bottom: 20px; }
    .post-wrap .back-link:hover { color: var(--olive); }
    .post-wrap .post-crumbs { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .post-wrap .post-crumbs a { color: var(--muted); }
    .post-wrap .post-crumbs a:hover { color: var(--olive); }
    .post-wrap .post-crumbs .sep { margin: 0 6px; }
    .post-wrap h1 { font-size: 30px; margin-bottom: 10px; }
    .post-wrap .post-date { color: var(--muted); font-size: 13px; margin-bottom: 26px; }
    .post-wrap .post-image { width: 100%; aspect-ratio: 16/9; background: var(--cream-deep); margin-bottom: 30px; overflow: hidden; }
    .post-wrap .post-image img { width: 100%; height: 100%; object-fit: cover; }
    .post-body { color: var(--ink); font-size: 15.5px; line-height: 1.9; }
    .post-body p { margin-bottom: 18px; }
    .post-body h2 { font-size: 20px; margin-top: 30px; }
    .post-body h3 { font-size: 17px; margin-top: 24px; }
    .post-body ul, .post-body ol { padding-left: 22px; margin-bottom: 18px; }
    .post-body li { margin-bottom: 8px; }
    .post-body img { width: 100%; margin: 20px 0; }
    .post-body a { color: var(--olive); border-bottom: 1px solid var(--olive); }
    .post-related { margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--line, #e5e0d6); }
    .post-related h2 { font-size: 20px; margin-bottom: 16px; }
    .post-related .product-grid { margin: 0; padding: 0; }
    .post-more ul { padding-left: 20px; }
    .post-more li { margin-bottom: 10px; }
    .post-more a { color: var(--olive); }
  </style>
  {{JSON_LD}}
</head>
<body>

  <main class="post-wrap" id="postWrap">{{CONTENT}}</main>

  <script src="/script.js"></script>
</body>
</html>
