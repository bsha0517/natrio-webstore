<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Confirmed — Natrio Organics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/favicon-180.png">
  <link rel="stylesheet" href="/style.css">
  <script src="https://apis.google.com/js/platform.js?onload=renderOptIn" async defer></script>
</head>
<body>
  <div class="section" style="max-width:560px;margin:0 auto;text-align:center;">
    <div id="content">Loading…</div>
  </div>
  <script src="/script.js"></script>
  <script>
    // Google Customer Reviews opt-in survey. platform.js loads
    // asynchronously and calls window.renderOptIn() once ready — but our
    // own order/settings data is also fetched asynchronously, so either
    // one could finish first. This waits for both before actually
    // rendering the survey.
    let googlePlatformReady = false;
    let orderReadyForOptIn = null; // set once order + settings are both loaded

    window.renderOptIn = function () {
      googlePlatformReady = true;
      tryShowGoogleOptIn();
    };

    function tryShowGoogleOptIn() {
      if (!googlePlatformReady || !orderReadyForOptIn) return;
      const { order, settings } = orderReadyForOptIn;
      if (!settings.googleMerchantId) { console.log('Google Customer Reviews: no Merchant ID set in admin Settings — skipping opt-in.'); return; }
      if (!order.customer.email) { console.log('Google Customer Reviews: this order has no customer email — skipping opt-in.'); return; }

      // estimate delivery a few days out, matching the site's stated 1–3 business day delivery window
      const estimated = new Date(order.date);
      estimated.setDate(estimated.getDate() + 3);
      const estimatedDeliveryDate = estimated.toISOString().split('T')[0];

      const optInConfig = {
        merchant_id: Number(settings.googleMerchantId),
        order_id: order.id,
        email: order.customer.email,
        delivery_country: 'PK',
        estimated_delivery_date: estimatedDeliveryDate
      };
      console.log('Google Customer Reviews: attempting to render opt-in with', optInConfig);

      window.gapi.load('surveyoptin', function () {
        try {
          window.gapi.surveyoptin.render(optInConfig);
          console.log('Google Customer Reviews: gapi.surveyoptin.render() called successfully. If nothing appears, this is very likely Google frequency-capping the popup (it will not re-show repeatedly to the same browser/order), an ad blocker, or a site verification issue in Merchant Center — not a bug in this call.');
        } catch (err) {
          console.error('Google Customer Reviews: render() threw an error:', err);
        }
      });
    }

    const id = new URLSearchParams(location.search).get('id');
    fetch(`/api/order/${id}`).then(r => r.json()).then(order => {
      if (order.error) {
        document.getElementById('content').innerHTML = `<p>Order not found.</p>`;
        return;
      }
      document.getElementById('content').innerHTML = `
        <h1>Thank you, ${order.customer.name.split(' ')[0]}!</h1>
        <p style="color:var(--muted);">Your order <strong>#${order.id}</strong> has been placed.</p>
        <div class="summary-box" style="text-align:left;margin-top:24px;">
          ${order.items.map(i => `<div class="summary-row"><span>${i.title} (${i.variant}) × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
          <div class="summary-row"><span>Shipping</span><span>${order.shipping === 0 ? 'Free' : money(order.shipping)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${money(order.total)}</span></div>
        </div>
        <p style="margin-top:20px;font-size:13px;color:var(--muted);">Payment method: ${order.paymentMethod.toUpperCase()}. We'll contact you at ${order.customer.phone} to confirm delivery.</p>
        <a href="/" class="btn btn-dark" style="margin-top:20px;">Back to Home</a>
      `;

      // report the completed sale to every ad/analytics platform that's
      // configured — each check is independent, so it's fine if only some
      // (or none) of these are set up.

      // Google Analytics (GA4)
      if (window.gtag) {
        gtag('event', 'purchase', {
          transaction_id: order.id,
          value: order.total,
          currency: 'PKR',
          shipping: order.shipping,
          items: order.items.map(i => ({
            item_id: i.productId,
            item_name: i.title,
            item_variant: i.variant,
            price: i.price,
            quantity: i.qty
          }))
        });
      }

      // Google Ads conversion (separate from GA4 — needs its own AW- ID + label)
      if (window.gtag && window.__googleAdsId && window.__googleAdsLabel) {
        gtag('event', 'conversion', {
          send_to: `${window.__googleAdsId}/${window.__googleAdsLabel}`,
          value: order.total,
          currency: 'PKR',
          transaction_id: order.id
        });
      }

      // Meta Pixel (Facebook / Instagram)
      if (window.fbq) {
        fbq('track', 'Purchase', {
          value: order.total,
          currency: 'PKR',
          content_ids: order.items.map(i => i.productId),
          contents: order.items.map(i => ({ id: i.productId, quantity: i.qty, item_price: i.price })),
          content_type: 'product'
        });
      }

      // TikTok Pixel
      if (window.ttq) {
        ttq.track('CompletePayment', {
          value: order.total,
          currency: 'PKR',
          content_id: order.id,
          contents: order.items.map(i => ({ content_id: i.productId, quantity: i.qty, price: i.price }))
        });
      }

      // Google Customer Reviews opt-in — fetch settings, then trigger
      // the survey once both this and platform.js are ready
      fetch('/api/settings').then(r => r.json()).then(settings => {
        orderReadyForOptIn = { order, settings };
        tryShowGoogleOptIn();
      }).catch(() => {});
    });
  </script>
</body>
</html>
