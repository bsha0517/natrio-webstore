<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Natrio Organics</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="page-header">
    <h1 id="pageTitle">All Products</h1>
  </div>

  <section class="section">
    <div class="product-grid" id="grid"></div>
  </section>

  <script src="/script.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const category = params.get('category');
    if (category) document.getElementById('pageTitle').textContent = category;

    function productCard(p) {
      return `
        <div class="product-card">
          <a href="/product.html?id=${p.id}">
            <div class="thumb">
              ${p.image ? `<img src="${p.image}" alt="${p.title}" onerror="this.parentElement.innerHTML='<span class=placeholder>${p.title}</span>'">` : `<span class="placeholder">${p.title}</span>`}
            </div>
          </a>
          <div class="body">
            <span class="category">${p.category}</span>
            <h3><a href="/product.html?id=${p.id}">${p.title}</a></h3>
            <div class="price">${money(p.price)}</div>
            <button class="add-btn" onclick="addToCart('${p.id}','${p.variants[0]}',1).then(()=>this.textContent='Added ✓')">Add to Cart</button>
          </div>
        </div>`;
    }

    const url = category ? `/api/products?category=${encodeURIComponent(category)}` : '/api/products';
    fetch(url).then(r => r.json()).then(list => {
      document.getElementById('grid').innerHTML = list.length
        ? list.map(productCard).join('')
        : `<div class="empty-state">No products found.</div>`;
    });
  </script>
</body>
</html>
