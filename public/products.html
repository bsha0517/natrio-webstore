<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop All Products — Natrio Organics</title>
  <meta name="description" content="Browse Natrio Organics' full range of pure, cold-pressed hair oils and facial care products. Nationwide delivery across Pakistan.">
  <link rel="canonical" href="https://natrio.pk/products.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shop All Products — Natrio Organics">
  <meta property="og:description" content="Browse Natrio Organics' full range of pure, cold-pressed hair oils and facial care products.">
  <meta property="og:url" content="https://natrio.pk/products.html">
  <meta property="og:image" content="https://natrio.pk/images/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/favicon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="page-header">
    <h1 id="pageTitle">All Products</h1>
  </div>

  <section class="section">
    <div class="product-grid" id="grid"></div>
  </section>

  <script src="/script.js"></script>
  <script>
    function slugify(str) {
      return String(str || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    // Category comes from the clean URL path (/products/hair-oils) if
    // present, otherwise falls back to the old ?category= query string.
    const pathSlug = location.pathname.match(/^\/products\/([^/]+)/);
    let category = null;
    const categoryReady = pathSlug
      ? fetch('/api/categories').then(r => r.json()).then(cats => {
          const match = cats.find(c => slugify(c.title) === decodeURIComponent(pathSlug[1]));
          category = match ? match.title : decodeURIComponent(pathSlug[1]);
        }).catch(() => {})
      : Promise.resolve().then(() => {
          category = new URLSearchParams(location.search).get('category');
        });

    function productCard(p) {
      return `
        <div class="product-card">
          <a href="/product/${p.id}">
            <div class="thumb">
              ${p.image ? `<img src="${p.image}" alt="${p.title}" onerror="this.parentElement.innerHTML='<span class=placeholder>${p.title}</span>'">` : `<span class="placeholder">${p.title}</span>`}
            </div>
          </a>
          <div class="body">
            <span class="category ${p.category === 'Facial Care' ? 'rose' : ''}">${p.category}</span>
            <h3><a href="/product/${p.id}">${p.title}</a></h3>
            <div class="price">${money(p.price)}</div>
            <button class="add-btn" onclick="addToCart('${p.id}','${(p.variants[0] && p.variants[0].name) || p.variants[0]}',1).then(()=>this.textContent='Added ✓')">Add to Cart</button>
          </div>
        </div>`;
    }

    categoryReady.then(() => {
      if (category) {
        document.getElementById('pageTitle').textContent = category;
        document.title = `${category} — Natrio Organics`;
        const desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute('content', `Shop ${category} from Natrio Organics — pure, cold-pressed, and made in Pakistan.`);
      }
      const url = category ? `/api/products?category=${encodeURIComponent(category)}` : '/api/products';
      fetch(url).then(r => r.json()).then(list => {
        document.getElementById('grid').innerHTML = list.length
          ? list.map(productCard).join('')
          : `<div class="empty-state">No products found.</div>`;
      });
    });
  </script>
</body>
</html>
